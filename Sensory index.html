<!doctype html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Fly Brain Chat</title>

<style>

body {
    font-family: system-ui;
    margin: 0;
    background: #111;
    color: #eee;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 18px;
}

#chat {
    height: 60vh;
    overflow: auto;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 12px;
}

.msg {
    margin: 10px 0;
    padding: 10px 12px;
    border-radius: 10px;
    max-width: 85%;
}

.you {
    margin-left: auto;
    background: #2d4;
}

.fly {
    background: #333;
}

#bar {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #555;
    background: #222;
    color: #fff;
}

button {
    padding: 12px 16px;
    border: 0;
    border-radius: 9px;
}

small {
    color: #aaa;
}

</style>

</head>

<body>

<main>

<h1>🪰 Fly Brain Chat</h1>

<small id="mode">
Connecting...
</small>

<div id="chat"></div>

<div id="bar">

<input
    id="msg"
    placeholder="Talk to the fly..."
    autocomplete="off"
>

<button onclick="send()">
Send
</button>

</div>

</main>

<script>

const chat =
    document.getElementById("chat");

const msg =
    document.getElementById("msg");


function addMessage(cls, name, text) {

    const div =
        document.createElement("div");

    div.className =
        "msg " + cls;

    div.textContent =
        name + ": " + text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


async function send() {

    const text =
        msg.value.trim();

    if (!text)
        return;

    addMessage(
        "you",
        "You",
        text
    );

    msg.value = "";

    const response =
        await fetch(
            "/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        message: text
                    })
            }
        );

    const result =
        await response.json();

    document.getElementById("mode")
        .textContent =
        result.mode;

    addMessage(
        "fly",
        "Fly",
        result.reply
    );
}


msg.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            send();
        }

    }
);


addMessage(
    "fly",
    "Fly",
    "Hello! Give me a sensory cue, like 'I see food' or 'danger is on the left'."
);

</script>

</body>

</html>
